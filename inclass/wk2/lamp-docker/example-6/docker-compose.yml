services:
  server:
    build: ./simple-server
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      MONGO_URI: mongodb://mongo:27017/lab1
    depends_on:
      mongo:
        condition: service_healthy
    develop:
      watch:
        # Node does not re-read a file mid-run the way PHP does, so a plain
        # sync is not enough -- the process has to come back up.
        - action: sync+restart
          path: ./simple-server
          target: /app
          ignore:
            - node_modules/
        # A new dependency means npm install has to run again, which only
        # happens during a build.
        - action: rebuild
          path: ./simple-server/package.json

  mongo:
    image: mongo:8
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  mongo_data:
