# The PRODUCTION image, run on your laptop: what Azure will run, before Azure runs it.
# Goes at the root of your repository, next to docker-compose.yml (which does not change).
#
#   docker compose -f docker-compose.prod.yml up --build       http://localhost:8090
#   docker compose -f docker-compose.prod.yml down             stop; the data is KEPT
#   docker compose -f docker-compose.prod.yml down -v          stop and throw the data away
#
# Two differences from `docker compose watch`, on purpose:
#   one container for the pages and the API (not two), and PostgreSQL (not MySQL),
#   because that is what the course's Azure platform runs.
# Stop `docker compose watch` first if your machine is short on memory; the ports do not clash.
name: pantry-example-final-prod

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: laptop-only-password
      POSTGRES_DB: app
    volumes:
      - proddata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      retries: 40

  app:
    build: .
    ports: ["8090:8080"]
    # The settings arrive as environment variables, exactly as they do on Azure.
    # These values are for a laptop. The deployed copy has its own, kept as secrets.
    environment:
      APP_NAME: "Floor Pantry"        # the platform bar shows it
      APP_KEY: base64:bGFwdG9wLW9ubHkta2V5LWxhcHRvcC1vbmx5LWtleSE=
      APP_URL: http://localhost:8090
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: app
      DB_USERNAME: app
      DB_PASSWORD: laptop-only-password
      SESSION_DRIVER: database
      CACHE_STORE: file
      SANCTUM_STATEFUL_DOMAINS: localhost:8090
      # Off: this app's own login, as in Homeworks 9 and 10. To see the platform login,
      # start with PRD=true in front of the command (Log in then goes to the hub).
      PRD: ${PRD:-false}
      HUB_URL: https://ta.biggermatrix.com
    depends_on:
      db: { condition: service_healthy }

volumes:
  proddata:
